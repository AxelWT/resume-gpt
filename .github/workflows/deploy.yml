name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Generate image metadata
        id: meta
        run: echo "image=${GITHUB_REPOSITORY@L}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}:${{ github.sha }}

      - name: Keep only latest 3 image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(echo "${GITHUB_REPOSITORY@L}" | cut -d'/' -f2)
          # 获取所有版本，按创建时间排序，排除 latest 标签，只保留最新 3 个
          VERSIONS=$(gh api -H "Accept: application/vnd.github+json" \
            "/user/packages/container/$PACKAGE_NAME/versions?per_page=100" \
            --jq '[.[] | select(.metadata.container.tags | index("latest") | not)] | sort_by(.created_at) | reverse | .[3:] | .[].id')
          for id in $VERSIONS; do
            echo "Deleting old image version: $id"
            gh api --method DELETE "/user/packages/container/$PACKAGE_NAME/versions/$id" || true
          done

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: OPENAI_API_KEY
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/app/resume-gpt' }}
            echo "OPENAI_API_KEY=$OPENAI_API_KEY" > .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
