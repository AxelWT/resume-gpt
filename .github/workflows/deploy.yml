name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOCKER_PROXY: ${{ secrets.DOCKER_PROXY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: OPENAI_API_KEY,DOCKER_PROXY
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/app/resume-gpt' }}

            # 拉取最新代码
            git pull origin main

            # 写入环境变量
            echo "OPENAI_API_KEY=$OPENAI_API_KEY" > .env

            # 配置 Docker 代理用于拉取基础镜像（如果 Secret 已配置）
            if [ -n "$DOCKER_PROXY" ]; then
              sudo mkdir -p /etc/systemd/system/docker.service.d
              cat <<PROXYEOF | sudo tee /etc/systemd/system/docker.service.d/proxy.conf > /dev/null
            [Service]
            Environment="HTTP_PROXY=$DOCKER_PROXY" "HTTPS_PROXY=$DOCKER_PROXY" "NO_PROXY=localhost,127.0.0.1"
            PROXYEOF
              sudo systemctl daemon-reload
              sudo systemctl restart docker
            fi

            # 构建并启动（--pull 始终拉取最新基础镜像）
            docker compose build --pull
            docker compose up -d --remove-orphans
            docker image prune -f

            # 清理代理配置
            if [ -n "$DOCKER_PROXY" ]; then
              sudo rm -f /etc/systemd/system/docker.service.d/proxy.conf
              sudo systemctl daemon-reload
              sudo systemctl restart docker
            fi
